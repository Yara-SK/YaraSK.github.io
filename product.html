<h1>AI Course Product</h1>

<p>Price: $999</p>

<button id="add-to-cart-btn">
  Add To Cart
</button>
<button id="purchase-btn">
 Buy Now
</button>

 <script>

window.dataLayer = window.dataLayer || [];


// view_item

dataLayer.push({
  event:"view_item",
  ecommerce:{
    items:[
      {
        item_id:"AI001",
        item_name:"AI Course",
        price:999,
        quantity:1
      }
    ]
  }
});


// add_to_cart

document
.getElementById("add-to-cart-btn")
.addEventListener("click", function(){

  dataLayer.push({
    event:"add_to_cart",
    ecommerce:{
      items:[
        {
          item_id:"AI001",
          item_name:"AI Course",
          price:999,
          quantity:1
        }
      ]
    }
  });

});


// purchase

document
.getElementById("purchase-btn")
.addEventListener("click", function(){

  dataLayer.push({
    event:"purchase",
    ecommerce:{
    purchase:{
      transaction_id:"T001",
      value:999,
      currency:"TWD",
      items:[
        {
          item_id:"AI001",
          item_name:"AI Course",
          price:999,
          quantity:1
        }
      ]
    }
  }
  });

});

</script>
