<html>

<head>

<title>Checkout</title>

</head>



<body>


<!-- Google Tag Manager (noscript) -->

<noscript>

<iframe
src="https://www.googletagmanager.com/ns.html?id=GTM-WRCX9TWB"
height="0"
width="0"
style="display:none">
</iframe>

</noscript>

<!-- End Google Tag Manager -->



<h1>Checkout</h1>


<div id="checkout-item"></div>


<button id="pay-btn">
Pay Now
</button>



<script>


window.dataLayer = window.dataLayer || [];



// 取得商品資料

const params =
new URLSearchParams(window.location.search);


const itemId =
params.get("id") || "AI001";


const itemName =
params.get("name") || "AI Course";


const itemPrice =
Number(params.get("price")) || 999;



const item = {

item_id:itemId,

item_name:itemName,

price:itemPrice,

quantity:1

};




// 顯示

document
.getElementById("checkout-item")
.innerHTML = `

<h2>${itemName}</h2>

<p>
Price: $${itemPrice}
</p>

`;




// ======================
// begin_checkout
// ======================


dataLayer.push({

event:"begin_checkout",

ecommerce:{

value:itemPrice,

currency:"TWD",

items:[

item

]

}

});





// ======================
// 點擊付款
// ======================


document
.getElementById("pay-btn")
.addEventListener("click",function(){


window.location.href =

"thankyou.html?id="
+itemId
+"&name="
+encodeURIComponent(itemName)
+"&price="
+itemPrice;


});



</script>


</body>

</html>
