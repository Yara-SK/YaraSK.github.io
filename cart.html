<h1>Shopping Cart</h1>


<div id="cart-item">

</div>


<button id="checkout-btn">
Go Checkout
</button>




<script>


window.dataLayer = window.dataLayer || [];



// =====================
// 取得商品資料
// =====================


const params =
new URLSearchParams(window.location.search);



const itemId =
params.get("id") || "AI001";


const itemName =
params.get("name") || "AI Course";


const itemPrice =
Number(params.get("price")) || 999;



const item = {

item_id:itemId,

item_name:itemName,

price:itemPrice,

quantity:1

};





// =====================
// 顯示購物車
// =====================


document
.getElementById("cart-item")
.innerHTML = `

<h2>${itemName}</h2>

<p>
Price: $${itemPrice}
</p>

<p>
Quantity: 1
</p>

`;





// =====================
// view_cart
// =====================


dataLayer.push({

event:"view_cart",

ecommerce:{

value:itemPrice,

currency:"TWD",

items:[

item

]

}

});



// 前往 checkout

document
.getElementById("checkout-btn")
.addEventListener("click", function(){

    window.location.href =
    "checkout.html?id="
    + itemId
    + "&name="
    + encodeURIComponent(itemName)
    + "&price="
    + itemPrice;

});



</script>
